.bit{padding:16px 0;font-size:16px}

.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ops .equals{grid-column:1/-1;background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.22)}
.ops .equals:hover{background:rgba(255,255,255,0.24)}
